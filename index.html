
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101b16">
  <title>Hidden Identity AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101b16;
      color: white;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: #17271e;
      border-bottom: 1px solid #304538;
    }

    .logo {
      width: 45px;
      height: 45px;
      border-radius: 14px;
      background: #238451;
      display: grid;
      place-items: center;
      font-size: 25px;
    }

    header h1 {
      font-size: 18px;
      margin: 0 0 5px;
    }

    header p {
      margin: 0;
      color: #9db8a5;
      font-size: 12px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      padding: 12px 14px;
      border-radius: 16px;
      max-width: 88%;
      line-height: 1.5;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .bot {
      align-self: flex-start;
      background: #203329;
      border-bottom-left-radius: 4px;
    }

    .user {
      align-self: flex-end;
      background: #238451;
      border-bottom-right-radius: 4px;
    }

    .label {
      display: block;
      font-size: 11px;
      color: #a8c9b4;
      margin-bottom: 5px;
    }

    .composer {
      padding: 12px;
      background: #17271e;
      border-top: 1px solid #304538;
    }

    form {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #40594a;
      border-radius: 14px;
      background: #203329;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #52c783;
    }

    button {
      border: none;
      border-radius: 14px;
      background: #238451;
      color: white;
      padding: 0 17px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .notice {
      text-align: center;
      color: #91a99a;
      font-size: 11px;
      margin: 10px 0 2px;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">✦</div>
    <div>
      <h1>Hidden Identity AI</h1>
      <p>Your questions. Your ideas. Your AI.</p>
    </div>
  </header>

  <main id="chat" aria-live="polite">
    <div class="message bot">
      <span class="label">Hidden Identity AI</span>
      Hey! 👋 Welcome to Hidden Identity AI.

      I'm your assistant for learning, business, technology and everyday questions.

      What would you like to explore today?
    </div>
  </main>

  <div class="composer">
    <form id="chatForm">
      <input
        id="userInput"
        type="text"
        placeholder="Ask me anything..."
        aria-label="Your message"
        autocomplete="off"
        required
      >
      <button id="sendButton" type="submit">Send</button>
    </form>
    <p class="notice">
      Prototype mode · Messages stay in this page for now
    </p>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("userInput");

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const message = input.value.trim();
  if (!message) return;

  addMessage(message, "user");
  input.value = "";

  const loadingMessage = addMessage("Thinking... 💭", "bot");

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "AI request failed.");
    }

    loadingMessage.textContent = data.reply;
  } catch (error) {
    loadingMessage.textContent =
      "Sorry, I couldn't connect to the AI. Please try again.";
    console.error("Chat error:", error);
  }
}):

   function addMessage(text, type) {
      const bubble = document.createElement("div");
      bubble.className = "message " + type;

      const label = document.createElement("span");
      label.className = "label";
      label.textContent = type === "user"
        ? "You"
        : "Hidden Identity AI";

      const content = document.createElement("div");
      content.textContent = text;

      bubble.appendChild(label);
      bubble.appendChild(content);
      chat.appendChild(bubble);

      chat.scrollTop = chat.scrollHeight; return content;
    }
  </script>
</body>
  </html>
